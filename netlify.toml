[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Frame protection for the managed OAuth login and consent screens.
[[headers]]
  for = "/connexion"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    Cache-Control = "no-store"

[[headers]]
  for = "/consentement"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    Cache-Control = "no-store"
