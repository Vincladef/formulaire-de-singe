[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # These URLs are public endpoints, including the Vite-injected client URL.
  # Keep scanning enabled for DATABASE_URL and all other real secrets.
  SECRETS_SCAN_OMIT_KEYS = "NEON_AUTH_URL,NEON_AUTH_JWKS_URL,VITE_NEON_AUTH_URL"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
